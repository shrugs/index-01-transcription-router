<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" width="760" height="220" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
  <style>
    .box { fill: #ffffff; stroke: #1f2328; stroke-width: 1.5; }
    .worker { fill: #fff4e8; stroke: #f38020; }
    .ghost { fill: none; stroke: #8c959f; stroke-dasharray: 4 5; }
    .title { fill: #1f2328; font-size: 15px; font-weight: 600; }
    .sub { fill: #59636e; font-size: 12px; }
    .label { fill: #59636e; font-size: 11px; }
    .line { stroke: #1f2328; stroke-width: 1.5; fill: none; }
    .dots { stroke: #8c959f; stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 0 7; fill: none; }
    .head { fill: #1f2328; }
    .ghosthead { fill: #8c959f; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #0d1117; stroke: #e6edf3; }
      .worker { fill: #2b1a0a; stroke: #f38020; }
      .title { fill: #e6edf3; }
      .sub, .label { fill: #9198a1; }
      .line { stroke: #e6edf3; }
      .head { fill: #e6edf3; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="ghostarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="ghosthead" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <!-- Index 01 ring -->
  <rect class="box" x="16" y="78" width="124" height="64" rx="10"/>
  <text class="title" x="78" y="106" text-anchor="middle">Index 01</text>
  <text class="sub" x="78" y="124" text-anchor="middle">ring</text>

  <path class="line" d="M140 110 H184" marker-end="url(#arrow)"/>
  <text class="label" x="162" y="102" text-anchor="middle">audio</text>

  <!-- Pebble app -->
  <rect class="box" x="186" y="78" width="124" height="64" rx="10"/>
  <text class="title" x="248" y="106" text-anchor="middle">Pebble app</text>
  <text class="sub" x="248" y="124" text-anchor="middle">phone</text>

  <path class="line" d="M310 110 H364" marker-end="url(#arrow)"/>
  <text class="label" x="337" y="102" text-anchor="middle">webhook</text>

  <!-- Cloudflare Worker -->
  <rect class="box worker" x="366" y="78" width="160" height="64" rx="10"/>
  <text class="title" x="446" y="106" text-anchor="middle">Cloudflare Worker</text>
  <text class="sub" x="446" y="124" text-anchor="middle">verify · transcribe</text>

  <!-- To Hermes -->
  <path class="line" d="M526 100 C560 100, 560 52, 594 52" marker-end="url(#arrow)"/>
  <text class="label" x="554" y="60" text-anchor="end">webhook</text>
  <rect class="box" x="596" y="20" width="148" height="64" rx="10"/>
  <text class="title" x="670" y="48" text-anchor="middle">Hermes</text>
  <text class="sub" x="670" y="66" text-anchor="middle">webhook gateway</text>

  <!-- To anything -->
  <path class="dots" d="M526 120 C560 120, 560 168, 590 168"/>
  <path class="ghosthead" d="M588 163 L597 168 L588 173 z"/>
  <rect class="box ghost" x="600" y="136" width="144" height="64" rx="10"/>
  <text class="title" x="672" y="162" text-anchor="middle" fill="#8c959f" style="fill:#8c959f">…</text>
  <text class="sub" x="672" y="182" text-anchor="middle">anything you want</text>
</svg>
